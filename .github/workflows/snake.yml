name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily refresh
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Standard GitHub green contribution palette (empty -> full),
          # with a contrasting orange snake travelling around it.
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=ff7b00&color_dots=161b22,0e4429,006d32,26a641,39d353
            dist/github-contribution-grid-snake.svg?color_snake=ff7b00&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
