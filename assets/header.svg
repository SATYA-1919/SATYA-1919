<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Satyaki Tirumal — Full-Stack, Mobile, DevOps">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" spreadMethod="pad">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="0.4" stop-color="#58A6FF"/>
      <stop offset="0.72" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#F778BA"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.3 0; 0.3 0; -0.3 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.65">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#A371F7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="900" height="250" rx="14" fill="#0D1117"/>
  <rect width="900" height="250" rx="14" fill="url(#glow)"/>
  <rect x="1" y="1" width="898" height="248" rx="13" fill="none" stroke="#1F6FEB" stroke-opacity="0.18"/>

  <!-- floating accent dots -->
  <circle cx="110" cy="70" r="4" fill="#58A6FF" opacity="0.55">
    <animate attributeName="cy" values="70;92;70" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="90" r="5" fill="#A371F7" opacity="0.5">
    <animate attributeName="cy" values="90;70;90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="185" r="3.5" fill="#F778BA" opacity="0.5">
    <animate attributeName="cy" values="185;200;185" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="180" r="3" fill="#1F6FEB" opacity="0.5">
    <animate attributeName="cy" values="180;165;180" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal tag -->
  <text x="450" y="78" text-anchor="middle" font-family="'Courier New',monospace"
    font-size="16" fill="#58A6FF" letter-spacing="2">~/ satyaki-tirumal</text>

  <!-- name -->
  <text x="450" y="148" text-anchor="middle"
    font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="700"
    fill="url(#nameGrad)">Satyaki Tirumal</text>

  <!-- animated underline -->
  <rect x="290" y="166" width="320" height="3" rx="2" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="450" y="200" text-anchor="middle" font-family="'Courier New',monospace"
    font-size="17" fill="#8b949e" letter-spacing="4">FULL-STACK · MOBILE · DEVOPS</text>
</svg>
